[project]
name = "litellm-code-review-router"
version = "0.1.0"
description = "Route code-review summaries across models with LiteLLM and compare cost and latency per model."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.79",
    "python-dotenv>=1.2.3",
]

[project.scripts]
review-router = "review_router.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_router"]

[tool.pytest.ini_options]
pythonpath = ["."]
