[project]
name = "temporal-py-film-festival-screening"
version = "0.1.0"
description = "A durable film-festival submission screening workflow on Temporal with OpenAI activities."
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8",
    "openai>=1.50",
    "opik==2.2.105",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
demo = "screening.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screening"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
