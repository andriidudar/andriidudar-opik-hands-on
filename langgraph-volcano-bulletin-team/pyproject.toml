[project]
name = "langgraph-volcano-bulletin-team"
version = "0.1.0"
description = "A planner/researcher/writer LangGraph team that drafts a volcano observatory's weekly bulletin"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.6",
    "opik==2.2.105",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bulletin = "volcano_bulletin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["volcano_bulletin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
