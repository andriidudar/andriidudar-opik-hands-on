[project]
name = "optimizer-podcast-genre-classifier"
version = "0.1.0"
description = "Tune a podcast genre classifier prompt over 30 invented episode blurbs, gpt-4o-mini only"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
