[project]
name = "langchain-fastapi-language-tutor"
version = "0.1.0"
description = "A Spanish-practice chat widget: FastAPI + LangChain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
