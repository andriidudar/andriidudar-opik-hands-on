[project]
name = "beeai-py-aquarium-alerts"
version = "0.1.0"
description = "A BeeAI ReAct agent that triages water-quality alerts for a fictional public aquarium"
requires-python = ">=3.12"
dependencies = [
    "beeai-framework==0.1.85",
    "openinference-instrumentation-beeai==0.1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opik==2.2.105",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
