[project]
name = "openai-bike-workshop-chat"
version = "0.1.0"
description = "A bike-repair workshop chat assistant on the OpenAI SDK"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
bikeshop = "bikeshop.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bikeshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
