[project]
name = "pydantic-ai-calendar-extraction"
version = "0.1.0"
description = "Pydantic AI agent that turns messy emails into typed calendar events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "logfire>=5.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opik>=2.2.105",
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
calendar-extraction = "calendar_extraction.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
